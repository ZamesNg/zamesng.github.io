# Personal-site overlay. Keep the starter's /al-folio defaults in _config.yml.
# Build: bundle exec jekyll build --config _config.yml,_config.personal.yml
url: https://zamesng.github.io
baseurl: ""
title: Zeming (Zames) Wu
first_name: Zeming
middle_name: ""
last_name: Wu
about_nav_title: Home
lang: en
icon: icon-transparent.png
description: >
  Zeming Wu is a PhD candidate at City University of Hong Kong working on
  distributed optimization, trajectory optimization, and motion planning for multi-agent systems.
keywords: robotics, distributed optimization, trajectory optimization, motion planning, multi-agent systems
contact_note: >
  For research discussions and collaboration, please reach me by email.
footer_text: >
  Built with <a href="https://jekyllrb.com/">Jekyll</a> and
  <a href="https://github.com/alshedivat/al-folio">al-folio</a>.
max_width: 1000px
footer_fixed: false
serve_og_meta: true
serve_schema_org: true
og_image: /assets/img/zeming-wu.jpg
posts_in_search: false
external_sources: []
pagination:
  enabled: false
related_blog_posts:
  enabled: false
jekyll-archives:
  posts:
    enabled: []
  books:
    enabled: []
collections:
  books:
    output: false
  news:
    output: false
  projects:
    output: false
  teachings:
    output: false
scholar:
  last_name: [Wu]
  first_name: [Zeming, Z.]
  source: /assets/bibliography/
  bibliography: publications.bib
  sort_by: sortkey
  order: ascending
  group_by: none
  group_order: ascending
filtered_bibtex_keywords:
  [
    abbr,
    abstract,
    additional_info,
    altmetric,
    annotation,
    arxiv,
    award,
    award_name,
    bibtex_show,
    blog,
    code,
    dimensions,
    eprint,
    google_scholar_id,
    hal,
    html,
    inspirehep_id,
    pdf,
    pmid,
    poster,
    preview,
    selected,
    slides,
    supp,
    video,
    website,
    keywords,
    sortkey,
    addendum,
    'author\+an',
  ]
max_author_limit: 99
enable_publication_thumbnails: true
enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: false
  inspirehep: false
enable_math: false
enable_masonry: false
enable_medium_zoom: false
enable_progressbar: false
